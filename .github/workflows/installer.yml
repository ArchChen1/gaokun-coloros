name: installer

# 安装器编译验证：后端在 Linux 上交叉编 ARM64（平板是 Windows-on-ARM），
# 界面在 GitHub 的 windows-11-arm 运行器上原生编 ARM64。
# 源码来自本仓库内置的 vendor/gaokun-android，clone 后无需子模块。
#
# 什么时候跑：push main（改了 vendor/ 或本文件）、PR、手动。
# 打 installer-vX.Y.Z 标签时会建一个【草稿】Release（只放安装器 zip，Latest 留给 ROM）。

on:
  push:
    branches: [main]
    paths:
      - 'vendor/gaokun-android/**'
      - '.github/workflows/installer.yml'
  pull_request:
    paths:
      - 'vendor/gaokun-android/**'
      - '.github/workflows/installer.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  FLUTTER_VERSION: '3.47.2'
  # 脚本输出有中文与"→"：Windows 运行器控制台是 cp1252，不设 UTF-8 会 UnicodeEncodeError
  PYTHONUTF8: '1'
  # 目录名。⚠️ 不能叫 LLVM_MINGW：Makefile 与 mke2fs/build.sh 把 LLVM_MINGW 当完整工具链路径
  LLVM_MINGW_NAME: llvm-mingw-20261104-ucrt-ubuntu-22.04-x86_64
  LLVM_MINGW_SHA256: 919380403de87dca3c581c2053230cd298af5e891286628ba0613b7fed370926
  GK3: vendor/gaokun-android

jobs:
  backend:
    name: backend (arm64)
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: vendor/gaokun-android
    steps:
      - uses: actions/checkout@v4

      - name: 装依赖
        run: sudo apt-get update -qq && sudo apt-get install -y -qq clang make python3 zstd e2fsprogs

      - name: llvm-mingw
        run: |
          curl -fsSL --retry 3 -o /tmp/llm.tar.xz \
            "https://github.com/mstorsjo/llvm-mingw/releases/download/20261104/${LLVM_MINGW_NAME}.tar.xz"
          echo "${LLVM_MINGW_SHA256}  /tmp/llm.tar.xz" | sha256sum -c
          mkdir -p "$HOME/opt" && tar -C "$HOME/opt" -xf /tmp/llm.tar.xz
          echo "LLVM_MINGW=$HOME/opt/${LLVM_MINGW_NAME}" >> "$GITHUB_ENV"

      - name: 主机单测
        run: make -C installer/backend test

      - name: 交叉编 gk3w + sdboot（arm64）
        run: make -C installer/backend win-arm64 sdboot "GK3W_VERSION=dev-${GITHUB_SHA::7}"

      - name: 编 mke2fs（arm64）
        run: bash installer/backend/mke2fs/build.sh arm64

      - name: 产物校验
        run: |
          ls -l installer/backend/build/arm64/gk3w.exe
          ls -l installer/backend/build/mke2fs-arm64/mke2fs.exe
          ls -l installer/backend/build/sdboot/systemd-bootaa64.efi
          # PE 头 machine 必须是 0xAA64（ARM64），x64 的会在平板上靠模拟跑，测不出来
          for f in installer/backend/build/arm64/gk3w.exe installer/backend/build/mke2fs-arm64/mke2fs.exe; do
            python3 - "$f" <<'PY'
import struct, sys
d = open(sys.argv[1], 'rb').read()
m = struct.unpack('<H', d[struct.unpack('<I', d[0x3c:0x40])[0] + 4:][:2])[0]
print(f"{sys.argv[1]}: machine 0x{m:04X}")
sys.exit(0 if m == 0xAA64 else 1)
PY
          done

      - uses: actions/upload-artifact@v4
        with:
          name: backend-arm64
          if-no-files-found: error
          path: |
            vendor/gaokun-android/installer/backend/build/arm64/gk3w.exe
            vendor/gaokun-android/installer/backend/build/mke2fs-arm64/mke2fs.exe
            vendor/gaokun-android/installer/backend/build/mke2fs-arm64/mke2fs.conf
            vendor/gaokun-android/installer/backend/build/sdboot/systemd-bootaa64.efi

  dart:
    name: flutter analyze + test
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: vendor/gaokun-android/installer/windows
    steps:
      - uses: actions/checkout@v4
      - name: flutter
        working-directory: .
        run: |
          git clone --quiet --depth 1 --branch "$FLUTTER_VERSION" https://github.com/flutter/flutter.git "$HOME/flutter"
          echo "$HOME/flutter/bin" >> "$GITHUB_PATH"
      - name: 字体
        working-directory: vendor/gaokun-android
        run: python3 installer/common/tool/fetch-fonts.py
      - name: analyze + test
        run: |
          flutter --disable-analytics
          flutter pub get
          flutter analyze
          flutter test

  app:
    name: app (arm64)
    needs: backend
    runs-on: windows-11-arm
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: backend-arm64
          path: vendor/gaokun-android/installer/backend/build

      - name: flutter
        shell: pwsh
        run: |
          git clone --quiet --depth 1 --branch $env:FLUTTER_VERSION https://github.com/flutter/flutter.git C:\flutter
          "C:\flutter\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: 字体
        shell: pwsh
        run: python vendor/gaokun-android/installer/common/tool/fetch-fonts.py

      - name: 编应用（arm64）
        shell: pwsh
        working-directory: vendor/gaokun-android/installer/windows
        run: |
          flutter --disable-analytics
          flutter config --enable-windows-desktop
          flutter pub get
          flutter build windows --release --dart-define=GK3_VERSION=dev-$($env:GITHUB_SHA.Substring(0,7))

      - name: 产物校验
        shell: pwsh
        run: |
          $rel = "vendor/gaokun-android/installer/windows/build/windows/arm64/runner/Release"
          foreach ($f in 'gk3_windows.exe','backend/gk3w.exe','backend/mke2fs.exe','backend/mke2fs.conf','backend/systemd-bootaa64.efi') {
            if (-not (Test-Path "$rel/$f")) { throw "missing $rel/$f" }
          }
          foreach ($f in 'gk3_windows.exe','backend/gk3w.exe','backend/mke2fs.exe') {
            $m = [System.IO.File]::ReadAllBytes((Resolve-Path "$rel/$f"))
            $machine = [BitConverter]::ToUInt16($m, [BitConverter]::ToInt32($m, 0x3c) + 4)
            if ($machine -ne 0xAA64) { throw ("{0}: machine 0x{1:X4}, want 0xAA64" -f $f, $machine) }
          }
          "$rel OK（三件 PE 全 0xAA64）" | Write-Host

      - uses: actions/upload-artifact@v4
        with:
          name: installer-windows-arm64
          if-no-files-found: error
          path: vendor/gaokun-android/installer/windows/build/windows/arm64/runner/Release

  release:
    name: draft release
    if: startsWith(github.ref, 'refs/tags/installer-v')
    needs: [backend, dart, app]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: installer-windows-arm64
          path: app
      - name: 打包并建草稿
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ver="${GITHUB_REF_NAME#installer-v}"
          name="gaokun-coloros-installer-$ver-windows-arm64"
          mv app "$name"
          zip -qr "$name.zip" "$name"
          sha256sum "$name.zip" > "$name.zip.sha256"
          flags=(--draft --latest=false --verify-tag)
          [[ "$ver" == *-* ]] && flags+=(--prerelease)
          gh release create "$GITHUB_REF_NAME" "$name.zip" "$name.zip.sha256" -R "$GITHUB_REPOSITORY" "${flags[@]}" \
            --title "Windows 安装器 $ver（ARM64）" \
            --notes "由 CI 从 $GITHUB_REF_NAME 生成（$GITHUB_SHA）。请改写说明后再发布，不要设为 Latest。"
